name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Cemetery photos are kept on their own branch so this one stays small.
      - name: Fetch cemetery photos
        run: |
          if git ls-remote --exit-code --heads origin cemetery-photos >/dev/null; then
            git fetch --depth 1 origin cemetery-photos
            mkdir -p src/assets/cemetery
            git --work-tree=src/assets/cemetery checkout FETCH_HEAD -- photos
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
